# Netlify: หน้าเว็บเป็น static · package.json มีไว้ให้ Netlify Functions (/api/rooms ใช้ @netlify/blobs · /api/analyze ใช้ @anthropic-ai/sdk)
# build คัดเฉพาะหน้าเว็บที่ใช้จริงไปไว้ใน dist (เอกสารและโน้ตอื่นในรีโปไม่ถูกเผยแพร่)
[build]
  command = "rm -rf dist && mkdir dist && cp -R coach-training mockup index.html dist/ && rm -f dist/mockup/index-v1.html"
  publish = "dist"

# Netlify Function: /api/ice ส่ง STUN / TURN ให้เล่นออนไลน์ (ตั้ง TURN ที่ Environment variables · ดูหัวไฟล์ ice.mjs)
#                   /api/rooms รายชื่อห้องที่เปิดอยู่ + ตรวจรหัสเข้าชม (ดูหัวไฟล์ rooms.mjs)
#                   /api/analyze ผู้ชมพิเศษให้ AI วิเคราะห์ผู้เล่น: ตั้ง ANTHROPIC_API_KEY และ/หรือ OPENROUTER_API_KEY (ดูหัวไฟล์ analyze.mjs)
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/mockup/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300"
