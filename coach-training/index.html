<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive Team Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f6f4ee; --surface:#ffffff; --surface2:#f0ede4; --fg:#1d1f24; --mut:#626a75; --line:#dedad0;
  --acc:#d9a400; --accfg:#1d1f24; --ok:#1f9d55; --bad:#c9382f; --red:#d6453c; --blue:#2f6fd0; --lock:#a8a59c;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0f1217; --surface:#171b22; --surface2:#1f242d; --fg:#e8ecf2; --mut:#9aa4b2; --line:#2b313b;
  --acc:#f5c518; --accfg:#111; --ok:#3ec97a; --bad:#ff7b6b; --red:#ef5b52; --blue:#5b93e8; --lock:#59606b;
} }
:root[data-theme="dark"] {
  --bg:#0f1217; --surface:#171b22; --surface2:#1f242d; --fg:#e8ecf2; --mut:#9aa4b2; --line:#2b313b;
  --acc:#f5c518; --accfg:#111; --ok:#3ec97a; --bad:#ff7b6b; --red:#ef5b52; --blue:#5b93e8; --lock:#59606b;
}
* { box-sizing:border-box }
html,body { margin:0; background:var(--bg); color:var(--fg); font-family:Sarabun,system-ui,sans-serif; line-height:1.55 }
a { color:var(--blue) }
header { position:sticky; top:0; z-index:5; background:var(--surface); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap }
header h1 { font-size:18px; margin:0; white-space:nowrap; cursor:pointer }
.brand { display:flex; flex-direction:column; line-height:1.15 }
.brand .ver { font-size:10px; color:var(--mut); font-weight:400; letter-spacing:.02em }
header h1 span { color:var(--acc) }
.prog { flex:1; min-width:140px; height:10px; background:var(--surface2); border-radius:6px; overflow:hidden }
.prog > div { height:100%; background:var(--acc); transition:width .3s }
#progTxt { font-size:13px; color:var(--mut); white-space:nowrap }
.hbtn { font:inherit; font-size:13px; background:var(--surface2); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:5px 10px; cursor:pointer }
.hbtn.on { border-color:var(--acc); outline:1px solid var(--acc) }
.layout { display:grid; grid-template-columns:300px 1fr; max-width:1280px; margin:0 auto }
nav { border-right:1px solid var(--line); padding:12px; height:calc(100vh - 54px); overflow:auto; position:sticky; top:54px }
.lvl { margin-bottom:12px }
.lvl h3 { font-size:13px; margin:6px 4px; color:var(--mut); display:flex; justify-content:space-between; gap:6px }
.lvl h3 b { color:var(--fg) }
.item { display:flex; gap:8px; align-items:flex-start; width:100%; text-align:left; font:inherit; font-size:14px; background:transparent; color:var(--fg); border:0; border-radius:8px; padding:6px 8px; cursor:pointer }
.item:hover:not(:disabled) { background:var(--surface2) }
.item.cur { background:var(--surface2); outline:2px solid var(--acc) }
.item:disabled { color:var(--lock); cursor:not-allowed }
.dot { flex:0 0 20px; height:20px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:11px; margin-top:1px }
.item.done .dot { background:var(--ok); border-color:var(--ok); color:#fff }
.item.open .dot { border-color:var(--acc) }
main { padding:20px 24px 80px; min-width:0 }
.home { max-width:1080px; margin:0 auto; padding:24px 16px 80px }
.home h2 { font-size:26px; margin:0 0 4px }
.roles { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin:18px 0 }
.role { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:8px }
.role .ico { font-size:30px }
.role h3 { margin:0; font-size:19px }
.role p { margin:0; color:var(--mut); font-size:14px; flex:1 }
.role .bar { height:8px; background:var(--surface2); border-radius:5px; overflow:hidden } .role .bar > div { height:100%; background:var(--acc) }
.role.free { border-style:dashed }
.crumb { font-size:13px; color:var(--mut) }
.diff { display:inline-block; font-size:12px; padding:1px 8px; border-radius:10px; background:var(--surface2); border:1px solid var(--line); margin-left:6px }
h2 { margin:4px 0 12px; font-size:24px }
.card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:12px 0 }
.card h4 { margin:0 0 8px; font-size:15px }
.scn { border-left:4px solid var(--acc) }
.rule { display:inline-block; font-size:12px; padding:0 7px; border-radius:6px; background:var(--surface2); border:1px solid var(--line); margin:2px 3px 2px 0; color:var(--mut) }
ul.act { margin:0; padding-left:20px } ul.act li { margin:3px 0 }
.tag { font-size:11px; color:var(--mut); border:1px solid var(--line); border-radius:5px; padding:0 5px; margin-left:4px; white-space:nowrap }
.q { padding:10px 0; border-top:1px dashed var(--line) } .q:first-of-type { border-top:0 }
.q p { margin:0 0 6px; font-weight:600 }
.opt { display:flex; gap:8px; align-items:flex-start; padding:6px 8px; border-radius:8px; cursor:pointer; border:1px solid transparent }
.opt:hover { background:var(--surface2) }
.opt input { margin-top:5px }
.opt.right { border-color:var(--ok) } .opt.wrong { border-color:var(--bad) }
.exp { font-size:13px; margin:6px 0 0 4px; padding:6px 10px; border-radius:8px; background:var(--surface2) }
.exp.ok { color:var(--ok) } .exp.bad { color:var(--bad) }
.btn { font:inherit; font-weight:700; background:var(--acc); color:var(--accfg); border:0; border-radius:8px; padding:8px 16px; cursor:pointer; text-decoration:none; display:inline-block }
.btn.sec { background:var(--surface2); color:var(--fg); border:1px solid var(--line); font-weight:600 }
.btn:disabled { opacity:.45; cursor:not-allowed }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center }
.chk { display:flex; gap:8px; align-items:flex-start; padding:4px 0; cursor:pointer }
.chk input { margin-top:5px }
.autoobj { display:flex; gap:8px; padding:3px 0 } .autoobj b { width:18px; flex:0 0 18px }
.status { font-weight:700 } .status.ok { color:var(--ok) } .status.bad { color:var(--bad) }
.ok { color:var(--ok) } .bad { color:var(--bad) } .mut { color:var(--mut) }
table.t { width:100%; border-collapse:collapse; font-size:14px } table.t td, table.t th { border-bottom:1px solid var(--line); padding:5px 6px; text-align:left } table.t th { color:var(--mut); font-weight:600 }
.cert { text-align:center; padding:28px 16px } .cert h2 { font-size:28px; color:var(--acc) }
input[type=text], input[type=url] { font:inherit; font-size:14px; padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:var(--surface2); color:var(--fg); width:100%; max-width:420px }
dialog { border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--fg); max-width:520px; width:92% }
dialog::backdrop { background:rgba(0,0,0,.45) }
#navToggle { display:none }
.pad { display:inline-flex; align-items:center; gap:6px; font-size:13px; padding:5px 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface2); color:var(--fg); text-decoration:none; white-space:nowrap }
.pad i { width:9px; height:9px; border-radius:50%; background:var(--lock); flex:0 0 9px }
.pad.on { border-color:var(--ok) } .pad.on i { background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent) }
.pad.off { border-color:var(--bad) } .pad.off i { background:var(--bad) }
.hidden { display:none !important }
@media (max-width:860px) {
  .layout { grid-template-columns:1fr }
  nav { position:static; height:auto; border-right:0; border-bottom:1px solid var(--line); display:none }
  nav.show { display:block }
  #navToggle { display:inline-block }
  main { padding:16px 16px 60px }
}
/* ซ่อนป้าย Powered by Netlify ที่โฮสต์แทรกเอง (บังปุ่มบนมือถือ) */
#nl-badge-frame,#nl-hud-frame{display:none!important}
</style>
</head>
<body>
<header>
  <button class="hbtn" id="navToggle">☰ บทเรียน</button>
  <div class="brand"><h1 id="homeLink">Drive Team <span>Academy</span> · BIOBUZZ</h1><div class="ver" title="เวอร์ชันของเว็บ ถ้าเลขไม่ตรงกับในทีม ให้กดรีเฟรช">v1.9.1</div></div>
  <div class="row" id="roleTabs"></div>
  <div class="prog"><div id="progBar" style="width:0%"></div></div>
  <span id="progTxt"></span>
  <a class="pad" id="padChip1" href="../mockup/gamepad-test.html?pad=1" target="_blank" title="คลิกเพื่อทดสอบ Joy 1"><i></i><span id="padChipTxt1">Joy 1: ยังไม่เชื่อม</span></a>
  <a class="pad" id="padChip2" href="../mockup/gamepad-test.html?pad=2" target="_blank" title="คลิกเพื่อทดสอบ Joy 2"><i></i><span id="padChipTxt2">Joy 2: ยังไม่เชื่อม</span></a>
  <button class="hbtn" id="btnSettings">ตั้งค่า</button>
</header>
<div id="homeView" class="home"></div>
<div class="layout hidden" id="roleView">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<dialog id="dlg">
  <h3 style="margin-top:0">ตั้งค่า</h3>
  <p style="margin:6px 0 2px">ลิงก์ simulator 3D ของเรา (สถานการณ์ฝึก)</p>
  <input type="url" id="mockUrl">
  <p style="margin:10px 0 2px">ลิงก์ simulator ตัวเต็ม (fork caryden)</p>
  <input type="url" id="simUrl">
  <p style="margin:10px 0 2px">ชื่อผู้ฝึก (แสดงบนใบผ่าน)</p>
  <input type="text" id="trainee">
  <label class="chk" style="margin-top:10px"><input type="checkbox" id="teacher"> โหมดครู: เปิดทุกบทโดยไม่ต้องผ่านตามลำดับ</label>
  <div class="row" style="margin-top:12px; justify-content:space-between">
    <button class="btn sec" id="btnReset">ล้างความคืบหน้าของบทบาทนี้</button>
    <button class="btn" id="btnClose">บันทึก</button>
  </div>
</dialog>

<script src="../mockup/scenarios.js"></script>
<script>
// ======================================================================
// หลักสูตร 4 บทบาท ไล่จากง่ายไปยาก แต่ละข้อมี: สถานการณ์ · สิ่งที่ต้องทำ ·
// แบบทดสอบ (ต้องถูกทุกข้อ) · สถานการณ์จำลอง 3D (ต้องผ่านเป้าหมายครบในรอบเดียว)
// อ้างอิงกติกา: BIOBUZZ Competition Manual TU05–TU08 (Section 9, 10, 11)
// "แนวปฏิบัติ" = เทคนิคการฝึก ไม่ใช่กฎ

const COACH = [

   scn:'ก่อนแมตช์แรก ทีมมีนักเรียน 5 คนและครู 2 คนที่อยากลงสนาม คุณต้องจัด Drive Team ให้ถูกกติกา',
   rules:['10.2','Table 10-1'],
   act:['Drive Team มีได้ไม่เกิน 4 คน จากทีมเดียวกัน: Drive Coach 1 คน + Driver/Human Player รวมกันไม่เกิน 3 คน',
        'คนที่ไม่ใช่นักเรียนลงได้ไม่เกิน 1 คน และต้องเป็นตำแหน่ง Drive Coach เท่านั้น เพราะ Driver และ Human Player ต้องเป็นนักเรียน',
        'Drive Coach ติดป้าย "DRIVE COACH" ส่วน Driver/Human Player ติดป้าย "DRIVE TEAM" เหนือเอวให้เห็นชัด (10.3.2 D)',
        'ตารางงานไทย: Drivers Meeting 9 ธ.ค. 17:30 เฉพาะ Driver 2 คน/ทีม <span class="tag">ตารางงานไทย</span>'],
   quiz:[
    { q:'Drive Team มีได้มากที่สุดกี่คน', o:['3 คน','4 คน','5 คน','ไม่จำกัด'], a:1, e:'สูงสุด 4 คน: Coach 1 + Driver/Human Player 3' },
    { q:'ครูที่ปรึกษาลงสนามได้ในตำแหน่งใด', o:['Driver','Human Player','Drive Coach','ได้ทุกตำแหน่ง'], a:2, e:'Driver และ Human Player ต้องเป็นนักเรียน ผู้ใหญ่เป็นได้แค่ Drive Coach และได้ไม่เกิน 1 คน' },
    { q:'ทีมใช้ Driver 2 คน + Human Player 1 คน + Coach 1 คน ถูกกติกาไหม', o:['ถูก','ผิด เพราะ Driver ได้แค่ 1 คน','ผิด เพราะต้องมี Human Player 2 คน'], a:0, e:'Driver + Human Player รวมไม่เกิน 3 จึงจัด 2+1 ได้' } ] },
 { id:'1.2', title:'สิ่งที่โค้ชทำได้ และห้ามทำ',

   act:['หลังแมตช์เริ่ม โค้ชห้ามจับจอย (G423) แต่ช่วยถือ Driver Station, แก้ปัญหาเครื่อง, เลือก OpMode, กด INIT / Start / Stop ได้',
        'โค้ชห้ามแตะลูก (G424) ยกเว้นเพื่อความปลอดภัย ให้ Human Player เป็นคนเก็บ NECTAR สีเราที่ออกนอกสนาม (G422)',
        'ทุกคนใน Drive Team ห้ามแตะหุ่น ลูกที่อยู่บนพื้น/หุ่น และอุปกรณ์สนาม (G425) ระวังสายจอยหรือเสื้อห้อยเข้าไปในสนาม',
        'ทุกคนต้องอยู่ใน ALLIANCE AREA ตลอดแมตช์ (G422)'],
   quiz:[

    { q:'NECTAR สีเราออกนอกสนามมาที่เท้าโค้ช ควรทำอย่างไร', o:['โค้ชหยิบส่งให้ Human Player','ให้ Human Player หยิบเอง แล้วใส่ทาง LOADING ZONE','โค้ชโยนกลับเข้าสนาม'], a:1, e:'G424 ห้ามโค้ชแตะลูก Drive Team คนอื่นเก็บ NECTAR สีตัวเองได้ (G422) และต้องใส่ผ่าน LOADING ZONE (G427)' },

 { id:'1.3', title:'เวลาแมตช์และสัญญาณเสียง',

   quiz:[

    { q:'เสียงเตือนกับนาฬิกาบนจอไม่ตรงกัน ยึดอะไร', o:['เสียง','นาฬิกาบนจอ','นาฬิกาข้อมือโค้ช'], a:1, e:'คู่มือ 9.11: นาฬิกาบนจอคือตัวตัดสิน' },
    { q:'ช่วงเปลี่ยน 8 วิ Driver ขยับหุ่นเข้าใกล้ลูกได้ไหม', o:['ได้','ไม่ได้ ผิด G403','ได้ถ้าช้า ๆ'], a:1, e:'G403 ห้ามมี powered movement ระหว่าง AUTO กับ TELEOP' } ] },

// ---------------- ผลจาก simulator ----------------
function mergeSim(r) {
  if (!r || !r.id) return; const p = ST.sim[r.id] || {};
  if (p.last && p.last.ts === r.ts) return;
  ST.sim[r.id] = { last:r, best: r.allOk ? r : (p.best || null), passes:(p.passes || 0) + (r.allOk ? 1 : 0), streak: r.allOk ? (p.streak || 0) + 1 : 0 };
  save(); render();
}
function pullSim() { const all = store.get('dca-sim-results') || {}; let ch = false; for (const [id, v] of Object.entries(all)) { const p = ST.sim[id]; if (!p || (v.last && (!p.last || v.last.ts > p.last.ts))) { ST.sim[id] = v; ch = true; } } if (ch) { save(); render(); } }
addEventListener('message', e => { if (e.data && e.data.type === 'dca-sim-result') mergeSim(e.data.result); });
addEventListener('storage', e => { if (e.key === 'dca-sim-results') pullSim(); if (e.key === 'dca-pad-test' || e.key === 'dca-pad-indep') render(); });
addEventListener('focus', pullSim);
const openSim = q => { const w = window.open(ST.mockUrl + q, 'biobuzz-sim'); if (w) w.focus(); };
const padUrl = () => { try { return new URL('gamepad-test.html', new URL(ST.mockUrl, location.href)).href; } catch { return '../mockup/gamepad-test.html'; } };
const padOk = () => !!(store.get('dca-pad-test') || {}).ok;

// ---------------- เงื่อนไขผ่าน ----------------
const simScn = d => d.sim && d.sim.scn && SC()[d.sim.scn] ? d.sim.scn : null;
const quizOk = (role, d) => d.quiz.every((q, qi) => (ST.roles[role].answers[d.id] || {})[qi] === q.a);
const checksOk = (role, d) => !d.sim || (d.sim.checks || []).every((_, ci) => (ST.roles[role].checks[d.id] || {})[ci]);
const scnOk = d => { const s = simScn(d); return !s || !!(ST.sim[s] && ST.sim[s].best); };
const drillOk = (role, d) => quizOk(role, d) && checksOk(role, d) && scnOk(d) && (!d.sim?.padTest || padOk());
const unlocked = (role, i) => { const a = ALL(role); return ST.teacher || i === 0 || !!ST.roles[role].passed[a[i - 1].id]; };
const firstOpen = role => { const a = ALL(role), i = a.findIndex(d => !ST.roles[role].passed[d.id]); return i < 0 ? a.length - 1 : i; };
function refreshPassed(role) { let ch = false; for (const d of ALL(role)) { const ok = drillOk(role, d); if (ok && !ST.roles[role].passed[d.id]) { ST.roles[role].passed[d.id] = Date.now(); ch = true; } } if (ch) save(); }

      <div class="mut" style="font-size:13px;margin-top:4px">${res ? `ผ่านแล้ว ${res.passes || 0} ครั้ง · ติดกัน ${res.streak || 0} ครั้ง · ล่าสุด ${new Date(res.last.ts).toLocaleString('th-TH')}` : 'ยังไม่เคยเล่นสถานการณ์นี้'}</div>`;
  }
  const pt = d.sim.padTest ? (() => { const r = store.get('dca-pad-test'); return `<div class="autoobj"><b class="${r && r.ok ? 'ok' : 'mut'}">${r && r.ok ? '✓' : '•'}</b><span>ทดสอบจอยผ่านครบทุกข้อ${r && r.ok ? ` · ${esc(r.id.slice(0, 40))} · ${new Date(r.ts).toLocaleString('th-TH')}` : ' (ตรวจอัตโนมัติจากหน้าทดสอบจอย)'}</span></div>`; })() : '';
  const btn = (d.sim.padTest ? `<a class="btn" href="${esc(padUrl())}" target="_blank">🎮 เปิดหน้าทดสอบจอย</a>` : '') + (sc ? `<button class="btn" id="openScn">▶ เปิดสถานการณ์นี้ใน simulator 3D</button>` : d.sim.free ? `<button class="btn ${d.sim.padTest ? 'sec' : ''}" id="openFree">▶ เปิด Free Control</button>` : '');
  return `<div class="card"><h4>ฝึกใน simulator ${sc ? '<span class="tag">3D · ตรวจอัตโนมัติ</span>' : ''}</h4>
    <p style="margin:0 0 6px">${esc(d.sim.task)}</p>${pt}${auto}
    <div class="row" style="margin:10px 0">${btn}${role === 'coach' && d.id === '6.5' ? `<a class="btn sec" href="${esc(ST.simUrl)}" target="_blank" rel="noopener">simulator ตัวเต็ม (caryden) ↗</a>` : ''}</div>
    ${(d.sim.checks || []).length ? `<div><b style="font-size:13px">ติ๊กเองเมื่อทำได้จริง</b></div>` + d.sim.checks.map((c, ci) => `<label class="chk"><input type="checkbox" data-c="${ci}" ${chk[ci] ? 'checked' : ''}><span>${esc(c)}</span></label>`).join('') : ''}
    ${sc ? '<p class="mut" style="font-size:12px;margin:6px 0 0">เปิด simulator จากปุ่มนี้เท่านั้น ผลจึงส่งกลับมาหน้านี้ได้ ถ้าผลยังไม่ขึ้น ให้กลับมาที่แท็บนี้อีกครั้ง</p>' : ''}</div>`;
}
function renderDrill(d) {
  const role = ST.role, all = ALL(role), i = all.findIndex(x => x.id === d.id), ans = R().answers[d.id] || {}, passed = !!R().passed[d.id];
  $('main').innerHTML = `
    <div class="crumb">${ROLES[role].ico} ${esc(ROLES[role].name)} · ${esc(d.level.name)} <span class="diff">${esc(d.level.diff)}</span></div>
    <h2>${d.id} ${esc(d.title)} ${passed ? '<span class="status ok">· ผ่านแล้ว</span>' : ''}</h2>
    <div class="card scn"><h4>สถานการณ์</h4>${esc(d.scn)}<div style="margin-top:8px">${d.rules.map(r => `<span class="rule">${esc(r)}</span>`).join('')}</div></div>
    <div class="card"><h4>สิ่งที่ต้องทำ</h4><ul class="act">${d.act.map(a => `<li>${a}</li>`).join('')}</ul>
      ${d.table ? `<table class="t" style="margin-top:10px">${d.table[0].length === 3 ? '<tr><th>การกระทำ</th><th>AUTO</th><th>TELEOP</th></tr>' : '<tr><th>รายการ</th><th>ค่า</th></tr>'}${d.table.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>` : ''}</div>
    <div class="card"><h4>แบบทดสอบ <span class="tag">ต้องตอบถูกทุกข้อ</span></h4><div id="quiz">${d.quiz.map((q, qi) => `
      <div class="q" data-q="${qi}"><p>${qi + 1}. ${esc(q.q)}</p>${q.o.map((o, oi) => `<label class="opt" data-o="${oi}"><input type="radio" name="q${qi}" value="${oi}" ${ans[qi] === oi ? 'checked' : ''}><span>${esc(o)}</span></label>`).join('')}<div class="exp" style="display:none"></div></div>`).join('')}</div>
      <div class="row" style="margin-top:8px"><button class="btn" id="btnCheck">ตรวจคำตอบ</button><span id="quizStatus" class="status"></span></div></div>
    ${simCard(d)}
    <div class="card"><div class="row" style="justify-content:space-between">
      <button class="btn sec" id="btnPrev" ${i === 0 ? 'disabled' : ''}>← ก่อนหน้า</button>
      <span id="gateTxt" class="status"></span>
      <button class="btn" id="btnNext">${i === all.length - 1 ? 'รับใบผ่าน' : 'ข้อต่อไป →'}</button></div></div>`;
  const markQuiz = show => {
    let right = 0;
    $('quiz').querySelectorAll('.q').forEach(el => {
      const qi = +el.dataset.q, q = d.quiz[qi], a = (R().answers[d.id] || {})[qi], exp = el.querySelector('.exp');
      el.querySelectorAll('.opt').forEach(o => o.classList.remove('right', 'wrong'));
      if (!show || a === undefined) { exp.style.display = 'none'; return; }
      const ok = a === q.a; if (ok) right++;
      el.querySelector(`.opt[data-o="${a}"]`).classList.add(ok ? 'right' : 'wrong');
      exp.style.display = 'block'; exp.className = 'exp ' + (ok ? 'ok' : 'bad'); exp.textContent = ok ? '✓ ถูก · ' + q.e : '✗ ยังไม่ถูก · ลองอ่าน "สิ่งที่ต้องทำ" อีกครั้ง';
    });
    if (show) { $('quizStatus').textContent = `ถูก ${right}/${d.quiz.length}`; $('quizStatus').className = 'status ' + (right === d.quiz.length ? 'ok' : 'bad'); }
  };
  const updateGate = () => {
    const q = quizOk(role, d), c = checksOk(role, d), s = scnOk(d), pt = !d.sim?.padTest || padOk(), ok = q && c && s && pt;
    if (ok && !R().passed[d.id]) { R().passed[d.id] = Date.now(); save(); renderNav(); }
    $('gateTxt').textContent = ok ? '✓ ผ่านข้อนี้แล้ว' : !q ? 'ตอบแบบทดสอบให้ถูกทุกข้อก่อน' : !s ? 'ผ่านสถานการณ์ 3D ให้ครบทุกเป้าหมายก่อน' : !pt ? 'ทดสอบจอยให้ผ่านก่อน' : 'ติ๊กงานฝึกให้ครบก่อน';
    $('gateTxt').className = 'status ' + (ok ? 'ok' : 'bad');
    $('btnNext').disabled = !ok && !ST.teacher;
  };
  $('quiz').querySelectorAll('input[type=radio]').forEach(r => r.onchange = () => { const qi = +r.name.slice(1); R().answers[d.id] = { ...(R().answers[d.id] || {}), [qi]: +r.value }; save(); markQuiz(false); $('quizStatus').textContent = ''; });
  $('btnCheck').onclick = () => { markQuiz(true); updateGate(); };
  $('main').querySelectorAll('input[type=checkbox][data-c]').forEach(c => c.onchange = () => { R().checks[d.id] = { ...(R().checks[d.id] || {}), [c.dataset.c]: c.checked }; save(); updateGate(); });
  const os = $('openScn'); if (os) os.onclick = () => openSim('?s=' + encodeURIComponent(simScn(d)));
  const of = $('openFree'); if (of) of.onclick = () => openSim('?mode=free');
  $('btnPrev').onclick = () => { R().cur = all[i - 1].id; save(); render(); scrollTo(0, 0); };
  $('btnNext').onclick = () => { R().cur = i === all.length - 1 ? 'cert' : all[i + 1].id; save(); render(); scrollTo(0, 0); };
  if (passed || Object.keys(ans).length === d.quiz.length) markQuiz(true);
  updateGate();
}
function renderCert() {
  const role = ST.role, all = ALL(role);
  if (!all.every(d => R().passed[d.id])) { R().cur = all[firstOpen(role)].id; return render(); }
  const last = Math.max(...all.map(d => R().passed[d.id]));
  $('main').innerHTML = `<div class="card cert"><div class="crumb">FIRST Tech Challenge Thailand ครั้งที่ 8 · BIOBUZZ</div><h2>ผ่านการฝึก ${esc(ROLES[role].name)}</h2>
    <p style="font-size:22px;margin:8px 0">${esc(ST.name || 'ผู้ฝึก')}</p><p>ผ่านครบ ${all.length} หัวข้อ ${ROLES[role].levels.length} ระดับ · ${new Date(last).toLocaleDateString('th-TH', { dateStyle:'long' })}</p>
    <p class="crumb">ใบนี้เป็นการรับรองภายในทีม ไม่ใช่เอกสารของ FIRST</p>
    <div class="row" style="justify-content:center;margin-top:12px"><button class="btn sec" onclick="print()">พิมพ์</button><button class="btn" id="toHome">ฝึกบทบาทอื่น</button></div></div>`;
  $('toHome').onclick = () => go(null);
}
function render() {
  renderTabs();
  if (!ST.role || !ROLES[ST.role]) return renderHome();
  $('homeView').classList.add('hidden'); $('roleView').classList.remove('hidden'); $('navToggle').classList.remove('hidden');
  const role = ST.role, all = ALL(role); refreshPassed(role);
  if (!R().cur || (R().cur !== 'cert' && !all.some(d => d.id === R().cur))) R().cur = all[firstOpen(role)].id;
  if (R().cur !== 'cert' && !unlocked(role, all.findIndex(d => d.id === R().cur))) R().cur = all[firstOpen(role)].id;
  renderNav();
  R().cur === 'cert' ? renderCert() : renderDrill(all.find(d => d.id === R().cur));
}

// ---------------- ตั้งค่า ----------------
$('btnSettings').onclick = () => { $('simUrl').value = ST.simUrl; $('mockUrl').value = ST.mockUrl; $('trainee').value = ST.name; $('teacher').checked = ST.teacher; $('btnReset').disabled = !ST.role; $('dlg').showModal(); };
$('btnClose').onclick = () => { ST.simUrl = $('simUrl').value.trim() || ST.simUrl; ST.mockUrl = $('mockUrl').value.trim() || ST.mockUrl; ST.name = $('trainee').value.trim(); ST.teacher = $('teacher').checked; save(); $('dlg').close(); render(); };
$('btnReset').onclick = () => { if (ST.role && confirm(`ล้างความคืบหน้าของบทบาท ${ROLES[ST.role].name}?`)) { ST.roles[ST.role] = blankRole(); save(); $('dlg').close(); render(); } };
$('navToggle').onclick = () => $('nav').classList.toggle('show');
$('homeLink').onclick = () => go(null);
addEventListener('hashchange', () => { const h = location.hash.slice(1); if ((h || null) !== ST.role) { ST.role = ROLES[h] ? h : null; save(); render(); } });
{ const h = location.hash.slice(1); if (ROLES[h]) ST.role = h; else if (location.hash === '#home') ST.role = null; }
// ---------------- สถานะ Joy 1 / Joy 2 (มุมขวาบน) ----------------
// ป้าย Joy 1 / Joy 2 (ลำดับเดียวกับ simulator และหน้าทดสอบ: ค่าที่ตั้งไว้ใน dca-pad-role หรือตัวที่ต่อก่อน = Joy 1)
const padSeen = [false, false];
const padKindTh = id => /054c|dualshock|dualsense|wireless controller|playstation|sony/i.test(id) ? 'DualShock 4' : /046d|logitech|f310|f710|dual action/i.test(id) ? 'Logitech' : /xbox|xinput|045e/i.test(id) ? 'Xbox' : 'จอย';
function padStatus() {
  const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(g => g && g.connected) : [];
  let role = {}; try { role = JSON.parse(localStorage.getItem('dca-pad-role') || '{}'); } catch {}
  const f = i => pads.find(g => g.index === i); let a = f(role.p1), b = f(role.p2); const rest = pads.filter(g => g !== a && g !== b); if (!a) a = rest.shift(); if (!b) b = rest.shift();
  let tests = {}; try { tests = JSON.parse(localStorage.getItem('dca-pad-tests') || '{}'); } catch {}
  [a, b].forEach((p, k) => {
    const n = k + 1, chip = $('padChip' + n), txt = $('padChipTxt' + n);
    try { const u = new URL(padUrl()); u.searchParams.set('pad', n); chip.href = u.href; } catch {}
    if (p) {
      padSeen[k] = true; const ok = tests[p.index + '|' + p.id]?.ok;
      chip.className = 'pad on'; txt.textContent = `Joy ${n}: ${padKindTh(p.id)}${ok ? ' ✓' : ''}`;
      chip.title = `Joy ${n} (${n === 1 ? 'คนขับ' : 'คนยิง'})\n${p.id}\nmapping: ${p.mapping || 'ไม่ระบุ'}\n${ok ? 'ทดสอบปุ่มผ่านแล้ว' : 'คลิกเพื่อทดสอบปุ่มทั้งหมด'}`;
    } else if (!navigator.getGamepads) {
      chip.className = 'pad off'; txt.textContent = `Joy ${n}: เบราว์เซอร์ไม่รองรับ`; chip.title = 'ใช้ Chrome, Edge หรือ Safari';
    } else {
      chip.className = 'pad' + (padSeen[k] ? ' off' : ''); txt.textContent = `Joy ${n}: ${padSeen[k] ? 'หลุด' : 'ยังไม่เชื่อม'}`;
      chip.title = padSeen[k] ? 'ตรวจสายหรือแบตเตอรี่ แล้วกดปุ่มบนจอยอีกครั้ง' : n === 2 ? 'ต่อจอยตัวที่ 2 (คนยิง) แล้วกดปุ่มใดก็ได้ 1 ครั้ง' : 'ต่อจอย (DualShock 4 หรือ Logitech F310) แล้วกดปุ่มใดก็ได้ 1 ครั้ง';
    }
  });
}
addEventListener('gamepadconnected', padStatus); addEventListener('gamepaddisconnected', padStatus);
setInterval(padStatus, 500);
pullSim(); render(); padStatus();
